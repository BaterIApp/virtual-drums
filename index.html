<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Batería Virtual</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0a0a0f; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  #stage { position:relative; width:100vw; height:100vh; }
  video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
  #ui { position:absolute; top:0; left:0; width:100%; z-index:10; padding:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { border:none; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:600; color:#fff; background:#1e1e2e; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  button:active { transform:scale(.96); }
  #startBtn { background:linear-gradient(135deg,#7c3aed,#4f46e5); }
  #calBtn { background:linear-gradient(135deg,#f59e0b,#d97706); }
  #calBtn.active { background:linear-gradient(135deg,#22c55e,#16a34a); }
  #resetBtn { background:#3f3f52; }
  #status { position:absolute; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); left:14px; right:14px; z-index:10; color:#e5e5f0; font-size:13px; background:rgba(10,10,15,.7); padding:10px 14px; border-radius:10px; line-height:1.4; }
  #calLabel { position:absolute; top:70px; left:14px; right:14px; z-index:10; color:#facc15; font-size:15px; font-weight:700; background:rgba(10,10,15,.75); padding:8px 14px; border-radius:10px; display:none; }
  #captureBtn { position:absolute; left:50%; bottom:calc(80px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:15; padding:16px 28px; font-size:16px; display:none; }
  #debug { position:absolute; top:130px; right:14px; z-index:10; color:#4ade80; font-size:11px; background:rgba(10,10,15,.75); padding:6px 10px; border-radius:8px; font-family:monospace; text-align:right; white-space:pre; }
  #jsError { position:absolute; top:190px; left:14px; right:14px; z-index:20; color:#fff; font-size:12px; background:rgba(220,38,38,.92); padding:10px; border-radius:8px; font-family:monospace; display:none; max-height:35vh; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <button id="startBtn">▶ Iniciar cámara</button>
    <button id="calBtn" disabled>🎯 Calibrar</button>
    <button id="resetBtn">↺ Reset</button>
    <button id="testSoundBtn">🔊 Probar sonido</button>
  </div>
  <div id="calLabel"></div>
  <button id="captureBtn">📸 Capturar posición</button>
  <div id="debug"></div>
  <div id="jsError"></div>
  <div id="status">Toca "Iniciar cámara" para comenzar.</div>
</div>

<script type="module">
import { HandLandmarker, PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const calBtn = document.getElementById('calBtn');
const resetBtn = document.getElementById('resetBtn');
const testSoundBtn = document.getElementById('testSoundBtn');
const captureBtn = document.getElementById('captureBtn');
const statusEl = document.getElementById('status');
const calLabel = document.getElementById('calLabel');
const debugEl = document.getElementById('debug');
const jsErrorEl = document.getElementById('jsError');

function showJsError(msg){
  jsErrorEl.style.display = 'block';
  jsErrorEl.textContent = (jsErrorEl.textContent ? jsErrorEl.textContent + '\n---\n' : '') + msg;
}
window.addEventListener('error', (e) => showJsError('ERROR: ' + e.message + ' (línea ' + e.lineno + ')'));
window.addEventListener('unhandledrejection', (e) => showJsError('PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

let W = 0, H = 0;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ---------- AUDIO ----------
let actx = null;
let noiseBuffer = null;
function initAudio(){
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const bufSize = actx.sampleRate * 1;
  noiseBuffer = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i=0;i<bufSize;i++) data[i] = Math.random()*2-1;
}
function ensureAudioRunning(){
  if (!actx) initAudio();
  if (actx.state !== 'running') actx.resume();
}
function envGain(g, start, peak, t0, atk, dec){
  g.gain.cancelScheduledValues(t0);
  g.gain.setValueAtTime(start, t0);
  g.gain.linearRampToValueAtTime(peak, t0+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+atk+dec);
}
function playKick(){
  const t0 = actx.currentTime;
  const osc = actx.createOscillator(); const g = actx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(150, t0);
  osc.frequency.exponentialRampToValueAtTime(40, t0+0.15);
  envGain(g, 0.001, 1, t0, 0.005, 0.15);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0+0.2);
}
function playKick2(){
  // igual timbre que kick pero levemente distinto para diferenciar el segundo bombo al oído
  const t0 = actx.currentTime;
  const osc = actx.createOscillator(); const g = actx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(165, t0);
  osc.frequency.exponentialRampToValueAtTime(45, t0+0.13);
  envGain(g, 0.001, 0.95, t0, 0.005, 0.13);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0+0.18);
}
function playSnare(){
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.8;
  const g = actx.createGain(); envGain(g, 0.001, 0.9, t0, 0.002, 0.15);
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  const osc = actx.createOscillator(); const g2 = actx.createGain();
  osc.type='triangle'; osc.frequency.value=200; envGain(g2, 0.001, 0.4, t0, 0.002, 0.1);
  osc.connect(g2); g2.connect(actx.destination);
  src.start(t0); src.stop(t0+0.2); osc.start(t0); osc.stop(t0+0.15);
}
function playHihatClosed(){
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
  const g = actx.createGain(); envGain(g, 0.001, 0.5, t0, 0.001, 0.06);
  src.connect(hp); hp.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0+0.08);
}
function playHihatOpen(){
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
  const g = actx.createGain(); envGain(g, 0.001, 0.5, t0, 0.001, 0.35);
  src.connect(hp); hp.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0+0.4);
}
function playPedalChick(){
  // sonido corto del pedal de hi-hat al cerrarse, sin que la mano lo toque
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=8000;
  const g = actx.createGain(); envGain(g, 0.001, 0.25, t0, 0.001, 0.02);
  src.connect(hp); hp.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0+0.04);
}
function playTom(){
  const t0 = actx.currentTime;
  const osc = actx.createOscillator(); const g = actx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(220, t0);
  osc.frequency.exponentialRampToValueAtTime(90, t0+0.2);
  envGain(g, 0.001, 0.9, t0, 0.005, 0.2);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0+0.25);
}
function playCrash(){
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5000;
  const g = actx.createGain(); envGain(g, 0.001, 0.6, t0, 0.002, 0.8);
  src.connect(hp); hp.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0+0.9);
}

// HiHat suena distinto según el estado del pedal izquierdo
function playHihat(){ hihatOpen ? playHihatOpen() : playHihatClosed(); }

const SOUND_MAP = { Kick:playKick, Kick2:playKick2, Snare:playSnare, HiHat:playHihat, Tom:playTom, Crash:playCrash };
const ZONE_COLORS = { Kick:'#ef4444', Kick2:'#a855f7', Snare:'#3b82f6', HiHat:'#eab308', Tom:'#22c55e', Crash:'#f97316' };
// tipo de disparo por zona: 'hand' = cualquier mano, 'footR' = pie derecho, 'footL' = pie izquierdo
const ZONE_TRIGGER = { Kick:'footR', Kick2:'footL', Snare:'hand', HiHat:'hand', Tom:'hand', Crash:'hand' };
const ZONE_ORDER = ['Kick','Snare','HiHat','Tom','Crash','Kick2'];
const ZONE_PROMPTS = {
  Kick: 'Toca en el piso donde está tu PEDAL DE KICK (pie derecho)',
  Snare: 'Toca donde va el SNARE',
  HiHat: 'Toca donde va el HI-HAT',
  Tom: 'Toca donde va el TOM',
  Crash: 'Toca donde va el CRASH',
  Kick2: 'Toca en el piso donde está tu SEGUNDO PEDAL / DOBLE BOMBO (pie izquierdo)'
};

testSoundBtn.addEventListener('click', () => {
  ensureAudioRunning(); playKick();
  statusEl.textContent = 'Si escuchaste el kick, el audio funciona bien. AudioContext state: ' + actx.state;
});

// ---------- CALIBRACIÓN ----------
let zones = [];
let hihatCalib = { openY: null, closedY: null }; // rango vertical del tobillo izquierdo
let calStage = 'idle'; // idle | zones | hihat_open | hihat_closed
let calIndex = 0;

function loadAll(){
  const savedZones = localStorageSafe('drumZones');
  if (savedZones) { try { zones = JSON.parse(savedZones); } catch(e){ zones = []; } }
  const savedHihat = localStorageSafe('hihatCalib');
  if (savedHihat) { try { hihatCalib = JSON.parse(savedHihat); } catch(e){} }
}
function saveAll(){
  localStorageSafe('drumZones', JSON.stringify(zones));
  localStorageSafe('hihatCalib', JSON.stringify(hihatCalib));
}
function localStorageSafe(key, val){
  try {
    if (val === undefined) return window.localStorage.getItem(key);
    window.localStorage.setItem(key, val);
  } catch(e){ return null; }
}

function startCalibration(){
  zones = [];
  hihatCalib = { openY: null, closedY: null };
  calIndex = 0;
  calStage = 'zones';
  calLabel.style.display = 'block';
  captureBtn.style.display = 'none';
  calLabel.textContent = ZONE_PROMPTS[ZONE_ORDER[calIndex]];
  calBtn.classList.add('active');
}

canvas.addEventListener('pointerdown', (e) => {
  if (calStage !== 'zones') return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  zones.push({ name: ZONE_ORDER[calIndex], x, y, r: 0.09 });
  calIndex++;
  if (calIndex >= ZONE_ORDER.length){
    calStage = 'hihat_open';
    calLabel.textContent = 'Levanta el TALÓN del pie izquierdo (hi-hat abierto) y mantenlo así. Toca "Capturar posición".';
    captureBtn.style.display = 'inline-block';
  } else {
    calLabel.textContent = ZONE_PROMPTS[ZONE_ORDER[calIndex]];
  }
});

captureBtn.addEventListener('click', () => {
  if (calStage === 'hihat_open'){
    if (points.LeftAnkle.smoothY === null){
      statusEl.textContent = 'No detecto tu pie izquierdo todavía — asegúrate de que se vea en cuadro.';
      return;
    }
    hihatCalib.openY = points.LeftAnkle.smoothY;
    calStage = 'hihat_closed';
    calLabel.textContent = 'Ahora PISA fuerte, apoya el pie izquierdo completo. Toca "Capturar posición".';
  } else if (calStage === 'hihat_closed'){
    if (points.LeftAnkle.smoothY === null){
      statusEl.textContent = 'No detecto tu pie izquierdo todavía — asegúrate de que se vea en cuadro.';
      return;
    }
    hihatCalib.closedY = points.LeftAnkle.smoothY;
    calStage = 'idle';
    calLabel.style.display = 'none';
    captureBtn.style.display = 'none';
    calBtn.classList.remove('active');
    saveAll();
    statusEl.textContent = 'Calibración completa (manos + pies + hi-hat). ¡A tocar!';
  }
});

resetBtn.addEventListener('click', () => {
  zones = []; hihatCalib = { openY:null, closedY:null };
  saveAll();
  statusEl.textContent = 'Todo borrado. Calibra de nuevo.';
});

// ---------- TRACKING GENÉRICO (manos y pies comparten la misma lógica de golpe) ----------
function newPointState(){ return { prevY:null, prevDy:0, smoothY:null, lastSeen:0 }; }
const points = {
  RightHand: newPointState(),
  LeftHand: newPointState(),
  RightFoot: newPointState(),
  LeftFoot: newPointState(),
  LeftAnkle: newPointState() // solo para estado del hi-hat, no dispara golpes
};

const lastHit = {};
const COOLDOWN_MS = 80;
const HAND_VELOCITY_FRACTION = 0.28; // fracción del ancho de hombros por frame para contar como golpe de mano
const FOOT_VELOCITY_FRACTION = 0.16; // el movimiento del pedal es más chico que el de la mano
const DEFAULT_SHOULDER_WIDTH = 0.18; // fallback si aún no se detecta el cuerpo
let shoulderWidth = DEFAULT_SHOULDER_WIDTH;
const SMOOTHING = 0.25;
const MIN_CONFIDENCE = 0.6;
const HIHAT_HYSTERESIS = 0.15; // % del rango calibrado, evita parpadeo del estado abierto/cerrado
let hihatOpen = true;
let flashZones = {};

function updateSmoothed(st, ny, now){
  if (now - st.lastSeen > 250){ st.smoothY = null; st.prevY = null; st.prevDy = 0; }
  st.lastSeen = now;
  if (st.smoothY === null) st.smoothY = ny;
  st.smoothY = st.smoothY * SMOOTHING + ny * (1 - SMOOTHING);
  return st.smoothY;
}

function checkZoneHit(nx, ny, allowedTrigger){
  let best = null, bestDist = Infinity;
  for (const z of zones){
    if (ZONE_TRIGGER[z.name] !== allowedTrigger) continue;
    const dx = nx - z.x, dy = ny - z.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < z.r && dist < bestDist){
      best = z; bestDist = dist;
    }
  }
  if (!best) return null;
  const now = performance.now();
  if (!lastHit[best.name] || now - lastHit[best.name] > COOLDOWN_MS){
    lastHit[best.name] = now;
    SOUND_MAP[best.name] && SOUND_MAP[best.name]();
    return best.name;
  }
  return null;
}

function processHitPoint(label, nx, ny, velocityFraction, triggerType){
  const threshold = velocityFraction * shoulderWidth;
  const st = points[label];
  const now = performance.now();
  const smY = updateSmoothed(st, ny, now);
  if (st.prevY !== null){
    const dy = smY - st.prevY;
    const wasFalling = st.prevDy > threshold;
    const nowSlowing = dy < st.prevDy * 0.5;
    if (wasFalling && nowSlowing && calStage === 'idle'){
      const hitName = checkZoneHit(nx, ny, triggerType);
      if (hitName) flashZones[hitName] = now;
    }
    st.prevDy = dy;
  }
  st.prevY = smY;
}

function updateHihatState(ny){
  const now = performance.now();
  const smY = updateSmoothed(points.LeftAnkle, ny, now);
  if (hihatCalib.openY === null || hihatCalib.closedY === null) return; // sin calibrar, no hace nada
  const range = hihatCalib.closedY - hihatCalib.openY; // closedY > openY normalmente (más abajo = más grande en pantalla)
  if (Math.abs(range) < 0.001) return;
  const t = (smY - hihatCalib.openY) / range; // 0 = abierto, 1 = cerrado
  const margin = HIHAT_HYSTERESIS;
  if (hihatOpen && t > 0.5 + margin){
    hihatOpen = false;
    if (calStage === 'idle') playPedalChick();
  } else if (!hihatOpen && t < 0.5 - margin){
    hihatOpen = true;
  }
}

function drawZones(){
  for (const z of zones){
    const cx = z.x*W, cy = z.y*H, r = z.r*W;
    const flashing = flashZones[z.name] && performance.now() - flashZones[z.name] < 120;
    ctx.beginPath();
    ctx.arc(cx, cy, flashing ? r*1.25 : r, 0, Math.PI*2);
    ctx.fillStyle = ZONE_COLORS[z.name] + (flashing ? 'aa' : '33');
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = ZONE_COLORS[z.name];
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(z.name, cx, cy+5);
  }
}

function drawPoint(nx, ny, color){
  ctx.beginPath();
  ctx.arc(nx*W, ny*H, 10, 0, Math.PI*2);
  ctx.fillStyle = '#ffffffcc'; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
}

// ---------- PROCESAMIENTO POR FRAME ----------
let handsRaw = 0, handsFiltered = 0, poseDetected = false;

function processHandResults(result){
  handsFiltered = 0;
  handsRaw = result.landmarks ? result.landmarks.length : 0;
  if (result.landmarks && result.landmarks.length){
    result.landmarks.forEach((lm, i) => {
      const handedness = result.handednesses && result.handednesses[i] ? result.handednesses[i][0] : null;
      const score = handedness ? handedness.score : 0;
      if (score < MIN_CONFIDENCE) return;
      const rawLabel = handedness ? handedness.categoryName : (i===0?'Left':'Right');
      const label = rawLabel === 'Left' ? 'Right' : 'Left'; // espejo visual
      handsFiltered++;

      const tip = lm[8];
      if (!tip || !isFinite(tip.x) || !isFinite(tip.y)) return;
      const nx = 1 - tip.x, ny = tip.y;
      if (nx < -0.5 || nx > 1.5 || ny < -0.5 || ny > 1.5) return;

      drawPoint(nx, ny, '#7c3aed');
      processHitPoint(label === 'Left' ? 'LeftHand' : 'RightHand', nx, ny, HAND_VELOCITY_FRACTION, 'hand');
    });
  }
}

function processPoseResults(result){
  poseDetected = !!(result.landmarks && result.landmarks.length);
  if (!poseDetected) return;
  const lm = result.landmarks[0]; // una sola persona
  // 11/12 = hombros, 31/32 = punta de pie, 29 = talón izquierdo
  const lShoulder = lm[11], rShoulder = lm[12];
  const rFootTip = lm[32], lFootTip = lm[31], lHeel = lm[29];

  if (lShoulder && rShoulder && isFinite(lShoulder.x) && isFinite(rShoulder.x)){
    const w = Math.abs(lShoulder.x - rShoulder.x);
    if (w > 0.02) shoulderWidth = w; // ignora lecturas absurdamente chicas
  }

  if (rFootTip && isFinite(rFootTip.x) && isFinite(rFootTip.y)){
    const nx = 1 - rFootTip.x, ny = rFootTip.y;
    drawPoint(nx, ny, '#ef4444');
    processHitPoint('RightFoot', nx, ny, FOOT_VELOCITY_FRACTION, 'footR');
  }
  if (lFootTip && isFinite(lFootTip.x) && isFinite(lFootTip.y)){
    const nx = 1 - lFootTip.x, ny = lFootTip.y;
    drawPoint(nx, ny, '#a855f7');
    processHitPoint('LeftFoot', nx, ny, FOOT_VELOCITY_FRACTION, 'footL');
  }
  if (lHeel && isFinite(lHeel.x) && isFinite(lHeel.y)){
    updateHihatState(lHeel.y);
  }
}

function renderFrame(){
  ctx.clearRect(0,0,W,H);
  drawZones();
  const hihatCalStatus = (hihatCalib.openY !== null && hihatCalib.closedY !== null) ? (hihatOpen ? 'ABIERTO' : 'CERRADO') : 'sin calibrar';
  debugEl.textContent = `manos: ${handsRaw}/${handsFiltered}  pose: ${poseDetected ? 'si' : 'no'}\nhombros: ${shoulderWidth.toFixed(3)}\nzonas: ${zones.length}  hihat: ${hihatCalStatus}`;
}

// ---------- MODELOS + LOOP ----------
let handLandmarker = null;
let poseLandmarker = null;
let running = false;

async function initModels(){
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.6,
    minHandPresenceConfidence: 0.6,
    minTrackingConfidence: 0.5
  });
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numPoses: 1,
    minPoseDetectionConfidence: 0.5,
    minPosePresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
}

function loop(){
  if (!running) return;
  if (video.readyState >= 2 && handLandmarker && poseLandmarker){
    const t = performance.now();
    const handResult = handLandmarker.detectForVideo(video, t);
    processHandResults(handResult);
    const poseResult = poseLandmarker.detectForVideo(video, t);
    processPoseResults(poseResult);
    renderFrame();
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Cargando...';
  try {
    ensureAudioRunning();
    statusEl.textContent = 'Cargando modelos de tracking (manos + cuerpo)...';
    if (!handLandmarker || !poseLandmarker) await initModels();
    statusEl.textContent = 'Pidiendo acceso a la cámara...';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    running = true;
    requestAnimationFrame(loop);
    startBtn.style.display = 'none';
    calBtn.disabled = false;
    loadAll();
    statusEl.textContent = zones.length
      ? 'Cámara activa. Ya tienes calibración guardada — a tocar.'
      : 'Cámara activa. Toca "Calibrar" — asegúrate de que se vean tus manos Y tus pies en cuadro.';
  } catch (err){
    statusEl.textContent = 'Error: ' + err.message;
    showJsError('INIT ERROR: ' + err.message);
    startBtn.disabled = false;
    startBtn.textContent = '▶ Iniciar cámara';
  }
});

calBtn.addEventListener('click', () => {
  ensureAudioRunning();
  startCalibration();
});
</script>
</body>
</html>
