<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Batería Virtual</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0a0a0f; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  #stage { position:relative; width:100vw; height:100vh; }
  video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
  #ui { position:absolute; top:0; left:0; width:100%; z-index:10; padding:12px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  button { border:none; border-radius:10px; padding:9px 14px; font-size:13px; font-weight:600; color:#fff; background:#1e1e2e; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  button:active { transform:scale(.96); }
  #startBtn { background:linear-gradient(135deg,#7c3aed,#4f46e5); }
  #calBtn { background:linear-gradient(135deg,#f59e0b,#d97706); }
  #calBtn.active { background:linear-gradient(135deg,#22c55e,#16a34a); }
  #resetBtn { background:#3f3f52; }
  #status { position:absolute; bottom:calc(12px + env(safe-area-inset-bottom, 0px)); left:12px; right:12px; z-index:10; color:#e5e5f0; font-size:12px; background:rgba(10,10,15,.72); padding:8px 12px; border-radius:10px; line-height:1.35; }
  #calLabel { position:absolute; top:64px; left:12px; right:12px; z-index:12; color:#facc15; font-size:15px; font-weight:700; background:rgba(10,10,15,.8); padding:10px 14px; border-radius:10px; display:none; }
  #captureBtn { position:absolute; left:50%; bottom:calc(120px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:15; padding:16px 28px; font-size:16px; background:linear-gradient(135deg,#06b6d4,#0891b2); display:none; white-space:nowrap; }
  #sizePanel { position:absolute; bottom:calc(58px + env(safe-area-inset-bottom, 0px)); left:12px; right:12px; z-index:11; background:rgba(10,10,15,.72); padding:8px 12px; border-radius:10px; display:flex; align-items:center; gap:10px; }
  #sizePanel label { color:#cbd5e1; font-size:11px; white-space:nowrap; }
  #sizeSlider { flex:1; height:26px; }
  #debug { position:absolute; top:64px; right:12px; z-index:10; color:#4ade80; font-size:11px; background:rgba(10,10,15,.75); padding:6px 9px; border-radius:8px; font-family:monospace; text-align:right; white-space:pre; }
  #jsError { position:absolute; top:150px; left:12px; right:12px; z-index:20; color:#fff; font-size:12px; background:rgba(220,38,38,.92); padding:10px; border-radius:8px; font-family:monospace; display:none; max-height:35vh; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <button id="startBtn">▶ Iniciar cámara</button>
    <button id="calBtn" disabled>🎯 Calibrar</button>
    <button id="resetBtn">↺ Reset</button>
    <button id="testSoundBtn">🔊 Test</button>
  </div>
  <div id="calLabel"></div>
  <button id="captureBtn">📸 Capturar posición</button>
  <div id="debug"></div>
  <div id="jsError"></div>
  <div id="sizePanel">
    <label>Tamaño</label>
    <input type="range" id="sizeSlider" min="40" max="220" value="90">
    <label>Sensib.</label>
    <input type="range" id="sensSlider" min="8" max="60" value="24">
  </div>
  <div id="status">Toca "Iniciar cámara" para comenzar.</div>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const calBtn = document.getElementById('calBtn');
const resetBtn = document.getElementById('resetBtn');
const testSoundBtn = document.getElementById('testSoundBtn');
const captureBtn = document.getElementById('captureBtn');
const statusEl = document.getElementById('status');
const calLabel = document.getElementById('calLabel');
const debugEl = document.getElementById('debug');
const jsErrorEl = document.getElementById('jsError');
const sizeSlider = document.getElementById('sizeSlider');
const sensSlider = document.getElementById('sensSlider');

function showJsError(msg){
  jsErrorEl.style.display = 'block';
  jsErrorEl.textContent = (jsErrorEl.textContent ? jsErrorEl.textContent + '\n---\n' : '') + msg;
}
window.addEventListener('error', (e) => showJsError('ERROR: ' + e.message + ' (línea ' + e.lineno + ')'));
window.addEventListener('unhandledrejection', (e) => showJsError('PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

let W = 0, H = 0;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ---------- AUDIO ----------
let actx = null, noiseBuffer = null;
function initAudio(){
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const bufSize = actx.sampleRate;
  noiseBuffer = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i=0;i<bufSize;i++) data[i] = Math.random()*2-1;
}
function ensureAudioRunning(){
  if (!actx) initAudio();
  if (actx.state !== 'running') actx.resume();
}
function env(g, peak, t0, atk, dec){
  g.gain.cancelScheduledValues(t0);
  g.gain.setValueAtTime(0.001, t0);
  g.gain.linearRampToValueAtTime(peak, t0+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+atk+dec);
}
function playKick(v=1){
  const t0 = actx.currentTime;
  const osc = actx.createOscillator(), g = actx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(150, t0);
  osc.frequency.exponentialRampToValueAtTime(40, t0+0.15);
  env(g, 1*v, t0, 0.005, 0.15);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0+0.2);
}
function playKick2(v=1){
  const t0 = actx.currentTime;
  const osc = actx.createOscillator(), g = actx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(165, t0);
  osc.frequency.exponentialRampToValueAtTime(45, t0+0.13);
  env(g, 0.95*v, t0, 0.005, 0.13);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0+0.18);
}
function playSnare(v=1){
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.8;
  const g = actx.createGain(); env(g, 0.9*v, t0, 0.002, 0.15);
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  const osc = actx.createOscillator(), g2 = actx.createGain();
  osc.type='triangle'; osc.frequency.value=200; env(g2, 0.4*v, t0, 0.002, 0.1);
  osc.connect(g2); g2.connect(actx.destination);
  src.start(t0); src.stop(t0+0.2); osc.start(t0); osc.stop(t0+0.15);
}
function playHihatClosed(v=1){
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
  const g = actx.createGain(); env(g, 0.5*v, t0, 0.001, 0.06);
  src.connect(hp); hp.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0+0.08);
}
function playHihatOpen(v=1){
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
  const g = actx.createGain(); env(g, 0.5*v, t0, 0.001, 0.35);
  src.connect(hp); hp.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0+0.4);
}
function playPedalChick(){
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=8000;
  const g = actx.createGain(); env(g, 0.25, t0, 0.001, 0.02);
  src.connect(hp); hp.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0+0.04);
}
function playTom(v=1){
  const t0 = actx.currentTime;
  const osc = actx.createOscillator(), g = actx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(220, t0);
  osc.frequency.exponentialRampToValueAtTime(90, t0+0.2);
  env(g, 0.9*v, t0, 0.005, 0.2);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0+0.25);
}
function playCrash(v=1){
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5000;
  const g = actx.createGain(); env(g, 0.6*v, t0, 0.002, 0.8);
  src.connect(hp); hp.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0+0.9);
}
function playHihat(v=1){ hihatOpen ? playHihatOpen(v) : playHihatClosed(v); }

const SOUND_MAP = { Kick:playKick, Kick2:playKick2, Snare:playSnare, HiHat:playHihat, Tom:playTom, Crash:playCrash };
const ZONE_COLORS = { Kick:'#ef4444', Kick2:'#a855f7', Snare:'#3b82f6', HiHat:'#eab308', Tom:'#22c55e', Crash:'#f97316' };
const ZONE_TRIGGER = { Kick:'footR', Kick2:'footL', Snare:'hand', HiHat:'hand', Tom:'hand', Crash:'hand' };
const ZONE_ORDER = ['Kick','Snare','HiHat','Tom','Crash','Kick2'];
const ZONE_PROMPTS = {
  Kick: '1/6 — Toca donde está tu PEDAL DE KICK (pie derecho)',
  Snare: '2/6 — Toca donde va el SNARE',
  HiHat: '3/6 — Toca donde va el HI-HAT',
  Tom: '4/6 — Toca donde va el TOM',
  Crash: '5/6 — Toca donde va el CRASH',
  Kick2: '6/6 — Toca donde está tu SEGUNDO PEDAL (pie izquierdo)'
};

testSoundBtn.addEventListener('click', () => {
  ensureAudioRunning(); playKick();
  statusEl.textContent = 'Audio OK. Estado: ' + actx.state;
});

// ---------- AJUSTES PERSISTENTES ----------
let zoneRadius = 0.09;   // radio de todas las zonas (ajustable con slider)
let sensitivity = 0.24;  // fracción del ancho de hombros que cuenta como golpe

function localStorageSafe(key, val){
  try {
    if (val === undefined) return window.localStorage.getItem(key);
    window.localStorage.setItem(key, val);
  } catch(e){ return null; }
}

sizeSlider.addEventListener('input', () => {
  zoneRadius = parseInt(sizeSlider.value, 10) / 1000;
  saveAll();
});
sensSlider.addEventListener('input', () => {
  sensitivity = parseInt(sensSlider.value, 10) / 100;
  saveAll();
});

// ---------- CALIBRACIÓN ----------
let zones = [];
let hihatCalib = { openY: null, closedY: null };
let calStage = 'idle';
let calIndex = 0;

function loadAll(){
  const sz = localStorageSafe('drumZones');
  if (sz) { try { zones = JSON.parse(sz); } catch(e){ zones = []; } }
  const sh = localStorageSafe('hihatCalib');
  if (sh) { try { hihatCalib = JSON.parse(sh); } catch(e){} }
  const sr = localStorageSafe('zoneRadius');
  if (sr) { zoneRadius = parseFloat(sr); sizeSlider.value = Math.round(zoneRadius*1000); }
  const ss = localStorageSafe('sensitivity');
  if (ss) { sensitivity = parseFloat(ss); sensSlider.value = Math.round(sensitivity*100); }
}
function saveAll(){
  localStorageSafe('drumZones', JSON.stringify(zones));
  localStorageSafe('hihatCalib', JSON.stringify(hihatCalib));
  localStorageSafe('zoneRadius', String(zoneRadius));
  localStorageSafe('sensitivity', String(sensitivity));
}

function startCalibration(){
  zones = [];
  hihatCalib = { openY:null, closedY:null };
  calIndex = 0;
  calStage = 'zones';
  calLabel.style.display = 'block';
  captureBtn.style.display = 'none';
  calLabel.textContent = ZONE_PROMPTS[ZONE_ORDER[calIndex]];
  calBtn.classList.add('active');
}

canvas.addEventListener('pointerdown', (e) => {
  if (calStage !== 'zones') return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  zones.push({ name: ZONE_ORDER[calIndex], x, y });
  calIndex++;
  if (calIndex >= ZONE_ORDER.length){
    calStage = 'hihat_open';
    calLabel.textContent = 'HI-HAT ABIERTO: levanta bien el TALÓN izquierdo y mantenlo. Toca "Capturar posición".';
    captureBtn.style.display = 'inline-block';
  } else {
    calLabel.textContent = ZONE_PROMPTS[ZONE_ORDER[calIndex]];
  }
});

captureBtn.addEventListener('click', () => {
  const heelY = points.LeftHeel.smoothY;
  if (heelY === null){
    statusEl.textContent = 'No detecto tu talón izquierdo — asegúrate de que se vean tus pies en cuadro.';
    return;
  }
  if (calStage === 'hihat_open'){
    hihatCalib.openY = heelY;
    calStage = 'hihat_closed';
    calLabel.textContent = 'HI-HAT CERRADO: apoya el pie izquierdo completo en el piso. Toca "Capturar posición".';
  } else if (calStage === 'hihat_closed'){
    hihatCalib.closedY = heelY;
    calStage = 'idle';
    calLabel.style.display = 'none';
    captureBtn.style.display = 'none';
    calBtn.classList.remove('active');
    saveAll();
    statusEl.textContent = 'Calibración completa. Ajusta tamaño y sensibilidad con los sliders mientras tocas.';
  }
});

resetBtn.addEventListener('click', () => {
  zones = []; hihatCalib = { openY:null, closedY:null };
  saveAll();
  statusEl.textContent = 'Borrado. Calibra de nuevo.';
});

// ---------- ESTADO DE PUNTOS ----------
function newPoint(){ return { prevY:null, prevT:0, smoothY:null, lastSeen:0, descending:false, peakV:0 }; }
const points = {
  RightHand: newPoint(), LeftHand: newPoint(),
  RightFoot: newPoint(), LeftFoot: newPoint(),
  LeftHeel:  newPoint()
};

const lastHit = {};
const COOLDOWN_MS = 70;
const FOOT_SENS_FACTOR = 0.55; // los pies se mueven menos que las manos
const SMOOTHING = 0.2;
const MIN_VISIBILITY = 0.5;
const HIHAT_HYSTERESIS = 0.15;
const DEFAULT_SHOULDER = 0.18;
let shoulderWidth = DEFAULT_SHOULDER;
let hihatOpen = true;
let flashZones = {};

function updateSmoothed(st, ny, now){
  if (now - st.lastSeen > 250){
    st.smoothY = null; st.prevY = null; st.prevDy = 0;
    st.descending = false; st.peakV = 0;
  }
  st.lastSeen = now;
  if (st.smoothY === null) st.smoothY = ny;
  st.smoothY = st.smoothY * SMOOTHING + ny * (1 - SMOOTHING);
  return st.smoothY;
}

function checkZoneHit(nx, ny, allowedTrigger, velNorm){
  let best = null, bestDist = Infinity;
  for (const z of zones){
    if (ZONE_TRIGGER[z.name] !== allowedTrigger) continue;
    const dx = nx - z.x, dy = ny - z.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < zoneRadius && dist < bestDist){ best = z; bestDist = dist; }
  }
  if (!best) return null;
  const now = performance.now();
  if (!lastHit[best.name] || now - lastHit[best.name] > COOLDOWN_MS){
    lastHit[best.name] = now;
    const vol = Math.max(0.35, Math.min(1, 0.35 + (velNorm - 1) * 0.4));
    SOUND_MAP[best.name] && SOUND_MAP[best.name](vol);
    return best.name;
  }
  return null;
}

// Máquina de estados: entra en "descendiendo" al superar el umbral,
// dispara al detectar el FONDO del golpe (cuando frena o devuelve).
// Mucho más tolerante que exigir un patrón exacto de dos cuadros.
function processHitPoint(label, nx, ny, sensFactor, triggerType){
  const st = points[label];
  const now = performance.now();
  const smY = updateSmoothed(st, ny, now);

  if (st.prevY === null){ st.prevY = smY; st.prevT = now; return; }

  const dt = Math.max(4, now - st.prevT);
  const v = (smY - st.prevY) / dt * 16.67; // normalizado a "por cuadro de 60fps"
  const threshold = sensitivity * sensFactor * shoulderWidth;

  if (!st.descending){
    if (v > threshold){ st.descending = true; st.peakV = v; }
  } else {
    if (v > st.peakV) st.peakV = v;
    if (v < st.peakV * 0.4 || v <= 0){
      if (calStage === 'idle'){
        const velNorm = st.peakV / Math.max(threshold, 1e-6);
        const hitName = checkZoneHit(nx, ny, triggerType, velNorm);
        if (hitName) flashZones[hitName] = now;
      }
      st.descending = false; st.peakV = 0;
    }
  }
  st.prevY = smY; st.prevT = now;
}

function updateHihatState(ny){
  const now = performance.now();
  const smY = updateSmoothed(points.LeftHeel, ny, now);
  if (hihatCalib.openY === null || hihatCalib.closedY === null) return;
  const range = hihatCalib.closedY - hihatCalib.openY;
  if (Math.abs(range) < 0.005) return;
  const t = (smY - hihatCalib.openY) / range; // 0 = abierto, 1 = cerrado
  if (hihatOpen && t > 0.5 + HIHAT_HYSTERESIS){
    hihatOpen = false;
    if (calStage === 'idle') playPedalChick();
  } else if (!hihatOpen && t < 0.5 - HIHAT_HYSTERESIS){
    hihatOpen = true;
  }
}

// ---------- DIBUJO ----------
function drawZones(){
  const now = performance.now();
  for (const z of zones){
    const cx = z.x*W, cy = z.y*H, r = zoneRadius*W;
    const flashing = flashZones[z.name] && now - flashZones[z.name] < 120;
    ctx.beginPath();
    ctx.arc(cx, cy, flashing ? r*1.2 : r, 0, Math.PI*2);
    ctx.fillStyle = ZONE_COLORS[z.name] + (flashing ? 'bb' : '30');
    ctx.fill();
    ctx.lineWidth = flashing ? 5 : 3;
    ctx.strokeStyle = ZONE_COLORS[z.name];
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(z.name, cx, cy+5);
  }
}
function drawPoint(nx, ny, color, descending){
  ctx.beginPath();
  ctx.arc(nx*W, ny*H, descending ? 14 : 9, 0, Math.PI*2);
  ctx.fillStyle = descending ? color : '#ffffffcc';
  ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
}

// ---------- PROCESAMIENTO ----------
let poseDetected = false, fps = 0, lastFrameT = 0;

function processPose(result){
  poseDetected = !!(result.landmarks && result.landmarks.length);
  if (!poseDetected) return;
  const lm = result.landmarks[0];
  const vis = (p) => (p && (p.visibility === undefined || p.visibility >= MIN_VISIBILITY) && isFinite(p.x) && isFinite(p.y));

  // hombros -> escala corporal (hace la sensibilidad independiente de la distancia)
  const lSh = lm[11], rSh = lm[12];
  if (vis(lSh) && vis(rSh)){
    const w = Math.abs(lSh.x - rSh.x);
    if (w > 0.02) shoulderWidth = w;
  }

  // manos: 19/20 = dedo índice (mejor proxy de la punta de baqueta que la muñeca)
  const lHand = vis(lm[19]) ? lm[19] : lm[15];
  const rHand = vis(lm[20]) ? lm[20] : lm[16];
  if (vis(lHand)){
    const nx = 1 - lHand.x, ny = lHand.y;
    drawPoint(nx, ny, '#7c3aed', points.LeftHand.descending);
    processHitPoint('LeftHand', nx, ny, 1.0, 'hand');
  }
  if (vis(rHand)){
    const nx = 1 - rHand.x, ny = rHand.y;
    drawPoint(nx, ny, '#7c3aed', points.RightHand.descending);
    processHitPoint('RightHand', nx, ny, 1.0, 'hand');
  }

  // pies: 31/32 = punta, 29 = talón izquierdo (estado hi-hat)
  const rFoot = lm[32], lFoot = lm[31], lHeel = lm[29];
  if (vis(rFoot)){
    const nx = 1 - rFoot.x, ny = rFoot.y;
    drawPoint(nx, ny, '#ef4444', points.RightFoot.descending);
    processHitPoint('RightFoot', nx, ny, FOOT_SENS_FACTOR, 'footR');
  }
  if (vis(lFoot)){
    const nx = 1 - lFoot.x, ny = lFoot.y;
    drawPoint(nx, ny, '#a855f7', points.LeftFoot.descending);
    processHitPoint('LeftFoot', nx, ny, FOOT_SENS_FACTOR, 'footL');
  }
  if (vis(lHeel)) updateHihatState(lHeel.y);
}

function renderOverlay(){
  const hh = (hihatCalib.openY !== null && hihatCalib.closedY !== null)
    ? (hihatOpen ? 'ABIERTO' : 'CERRADO') : 'sin calib';
  debugEl.textContent =
    `fps: ${fps.toFixed(0)}  pose: ${poseDetected?'si':'no'}\n` +
    `hombros: ${shoulderWidth.toFixed(3)}\n` +
    `tamaño: ${zoneRadius.toFixed(3)}  sens: ${sensitivity.toFixed(2)}\n` +
    `hihat: ${hh}`;
}

// ---------- MODELO + LOOP ----------
let poseLandmarker = null, running = false;

async function initModel(){
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numPoses: 1,
    minPoseDetectionConfidence: 0.5,
    minPosePresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
}

function loop(){
  if (!running) return;
  if (video.readyState >= 2 && poseLandmarker){
    const t = performance.now();
    if (lastFrameT){
      const inst = 1000 / Math.max(1, t - lastFrameT);
      fps = fps ? fps*0.9 + inst*0.1 : inst;
    }
    lastFrameT = t;
    ctx.clearRect(0,0,W,H);
    drawZones();
    const res = poseLandmarker.detectForVideo(video, t);
    processPose(res);
    renderOverlay();
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Cargando...';
  try {
    ensureAudioRunning();
    statusEl.textContent = 'Cargando modelo de cuerpo...';
    if (!poseLandmarker) await initModel();
    statusEl.textContent = 'Pidiendo cámara...';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'user', width:{ideal:640}, height:{ideal:480} }, audio:false
    });
    video.srcObject = stream;
    await video.play();
    running = true;
    requestAnimationFrame(loop);
    startBtn.style.display = 'none';
    calBtn.disabled = false;
    loadAll();
    statusEl.textContent = zones.length
      ? 'Listo. Ajusta tamaño/sensibilidad con los sliders mientras tocas.'
      : 'Cámara activa. Toca "Calibrar" — deben verse manos Y pies en cuadro.';
  } catch (err){
    statusEl.textContent = 'Error: ' + err.message;
    showJsError('INIT ERROR: ' + err.message);
    startBtn.disabled = false;
    startBtn.textContent = '▶ Iniciar cámara';
  }
});

calBtn.addEventListener('click', () => { ensureAudioRunning(); startCalibration(); });
loadAll();
</script>
</body>
</html>
